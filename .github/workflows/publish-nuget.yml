name: NuGet release

# Run from main. By default this only builds downloadable release packages.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example, v1.0.0-beta.1)'
        required: true
        type: string
      publish:
        description: 'Publish the packages to NuGet.org'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build release packages
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pack.outputs.version }}
      package-sha256: ${{ steps.pack.outputs.package-sha256 }}
      symbols-sha256: ${{ steps.pack.outputs.symbols-sha256 }}
    steps:
      - name: Require the official repository and main workflow
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if ($env:RELEASE_REPOSITORY -cne 'RossM/Disharmony' -or $env:RELEASE_REF -cne 'refs/heads/main') {
            throw 'Run this workflow from main in RossM/Disharmony.'
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and validate the tagged packages
        id: pack
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./.github/scripts/Build-NuGetRelease.ps1 -Tag $env:RELEASE_TAG
      - name: Retain release packages
        id: artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nuget-release
          path: artifacts/nuget/
          if-no-files-found: error
          retention-days: 14
      - name: Summarize the requested action
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "[Download release packages]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          if ($env:PUBLISH_REQUESTED -eq 'true') {
            'Publication was requested; check the Publish job for its outcome.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Build only: nothing was published to NuGet.org.' >> $env:GITHUB_STEP_SUMMARY
          }

  publish:
    name: Publish to NuGet.org
    needs: build
    if: inputs.publish && github.repository == 'RossM/Disharmony' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    # Configure this environment's protection rules in GitHub repository settings.
    environment: nuget
    concurrency:
      group: nuget-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      # This job never checks out or builds source with publishing credentials.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.400'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nuget-release
          path: artifacts/nuget
      - name: Verify the downloaded packages
        env:
          PACKAGE_SHA256: ${{ needs.build.outputs.package-sha256 }}
          SYMBOLS_SHA256: ${{ needs.build.outputs.symbols-sha256 }}
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts/nuget -Recurse -Force -File)
          if ($files.Count -ne 2) { throw 'Expected exactly one package and one symbol package.' }
          $package = "artifacts/nuget/Disharmony.$env:RELEASE_VERSION.nupkg"
          $symbols = "artifacts/nuget/Disharmony.$env:RELEASE_VERSION.snupkg"
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -ne $env:PACKAGE_SHA256) {
            throw 'The downloaded package does not match the build.'
          }
          if ((Get-FileHash -LiteralPath $symbols -Algorithm SHA256).Hash -ne $env:SYMBOLS_SHA256) {
            throw 'The downloaded symbol package does not match the build.'
          }
      - name: Obtain temporary NuGet credentials
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: RossM
      - name: Publish package and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUGET_SYMBOL_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # NuGet also pushes the matching .snupkg alongside this .nupkg.
          dotnet nuget push "artifacts/nuget/Disharmony.$env:RELEASE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Uploaded Disharmony $env:RELEASE_VERSION and its symbols. Verify NuGet.org validation and indexing before announcing the release." >> $env:GITHUB_STEP_SUMMARY
